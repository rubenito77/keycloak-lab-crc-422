apiVersion: v1
kind: Secret
metadata:
  name: keycloak-credentials
  namespace: keycloak-lab
type: Opaque
stringData:
  # Cambiá estas credenciales antes de aplicar en un entorno compartido
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: keycloak-admin-pass
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: keycloak-lab-pass
